<script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n22:[\"$\",\"span\",null,{\"className\":\"page-banner__date\",\"children\":[\"Published on \",\"03 Nov 2023\"]}]\n24:[\"$\",\"main\",null,{\"className\":\"layout layout--standard\",\"children\":[[\"$\",\"article\",null,{\"className\":\"container container--narrow\",\"children\":[\"$undefined\",[\"$\",\"$L26\",null,{\"data\":{\"content\":\"$27\"}}],[]]}]]}]\n27:T58f,\u003cp>As Singapore develops its digital economy, a trusted ecosystem is key - one where organisations can benefit from tech innovations while consumers are confident to adopt and use AI. In the global discourse on AI ethics and governance, Singapore believes that its balanced approach can facilitate innovation, safeguard consumer interests, and serve as a common global reference point.&nbsp;\u003c/p>\n\u003cp class=\"Default\" style=\"color: #000000; margin: 0cm;\">IMDA had developed AI Verify, an AI governance testing framework and a software toolkit. "])</script>
<script>self.__next_f.push([1,"The testing framework consists of 11 AI ethics principles* which jurisdictions around the world coalesce around, and are consistent with internationally recognised AI frameworks such as those from EU, OECD and Singapore&rsquo;s Model AI Governance Framework.\u003c/p>\n\u003ch2>Model AI Governance Framework\u003c/h2>\n\u003cp>On 23 January 2019, the PDPC released its first edition of the Model AI Governance Framework (Model Framework) for broader consultation, adoption and feedback. The Model Framework provides detailed and readily-implementable guidance to private sector organisations to address key ethical and governance issues when deploying AI solutions.\u003c/p>\n\u003cp>On 21 January 2020, the PDPC released the second edition of the Model Framework.&nbsp;\u003c/p>\n\u003ch2>Guiding Principles\u003c/h2>\n\u003cp>Decisions made by AI should be explainable, transparent and fair, and AI systems should be human-centric.\u003c/p>"])</script>
